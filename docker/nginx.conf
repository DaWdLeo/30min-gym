server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # App liegt unter /30min-gym/ (wie auf GitHub Pages); / leitet dorthin weiter
  location = / { return 302 /30min-gym/; }
  location /30min-gym/ {
    try_files $uri $uri/ /30min-gym/index.html;
  }

  # Service Worker und Startseite nie zwischenspeichern → Updates kommen sofort an
  location ~* /30min-gym/(sw\.js|index\.html)$ {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
  }
  location ~* \.webmanifest$ {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  # Bewusst KEIN X-Frame-Options, damit die Einbindung in Homarr als iFrame funktioniert.
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy no-referrer;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()";
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
}
